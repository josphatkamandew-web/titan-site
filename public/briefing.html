<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Titan VSA X — Morning Briefing</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="topnav-root"></div>
<div class="layout">
  <div id="sidenav-root"></div>
  <main>
    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:8px;">
      <h1 class="headline-lg" style="margin:0;">Morning Briefing</h1>
      <span class="label-caps" id="briefing-date-label" style="color:var(--on-surface-variant);"></span>
    </div>
    <p style="color:var(--on-surface-variant); font-size:13px; margin-bottom:24px;">
      Generated automatically every day at 09:00 EAT (before London open) by a scheduled job — nothing to click.
      This is directional context to sit alongside your own analysis, not a signal to trade on directly.
    </p>

    <div id="briefing-list" class="grid" style="grid-template-columns: 1fr; gap:16px;"></div>
    <div id="briefing-empty" class="empty-state" style="display:none;"></div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/briefing.js"></script>
</body>
</html>
